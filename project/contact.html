<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Paul Ethan">
    <meta name="description"
        content="A website about finding traditional delicious kenyan cuzines in different places in kenya.">
    <title>Contact | Kenyan Street Bites</title>

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script defer src="scripts/main.js"></script>
</head>

<body>

    <header>
        <h1>Kenyan Street Bites</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="foods.html">Foods</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Subscribe to Updates</h2>

        <form id="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label>Favorite Food</label>
            <label><input type="radio" name="food" value="Nyama Choma" required> Nyama Choma</label>
            <label><input type="radio" name="food" value="Mutura"> Mutura</label>
            <label><input type="radio" name="food" value="Mandazi"> Mandazi</label>

            <button type="submit">Subscribe</button>
        </form>

        <div id="form-message"></div>
    </main>

    <footer>
        <p>&copy; 2026 Kenyan Street Bites</p>
        <a href="references.html">References</a>
    </footer>

</body>

</html>
