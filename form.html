<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Paul Ethan">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <div class="form-group">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <div class="form-group">
                <fieldset>
                    <legend>Overall Rating</legend>

                    <input type="radio" id="rating1" name="rating" value="1" required>
                    <label for="rating1">☆</label>

                    <input type="radio" id="rating2" name="rating" value="2">
                    <label for="rating2">☆☆</label>

                    <input type="radio" id="rating3" name="rating" value="3">
                    <label for="rating3">☆☆☆</label>

                    <input type="radio" id="rating4" name="rating" value="4">
                    <label for="rating4">☆☆☆☆</label>

                    <input type="radio" id="rating5" name="rating" value="5">
                    <label for="rating5">☆☆☆☆☆</label>
                </fieldset>
            </div>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <div class="form-group">
                <fieldset>
                    <legend>Useful Features (Check all that apply)</legend>

                    <input type="checkbox" id="feature1" name="features" value="Durability">
                    <label for="feature1">Durability</label>

                    <input type="checkbox" id="feature2" name="features" value="Ease of Use">
                    <label for="feature2">Ease of Use</label>

                    <input type="checkbox" id="feature3" name="features" value="Performance">
                    <label for="feature3">Performance</label>

                    <input type="checkbox" id="feature4" name="features" value="Design">
                    <label for="feature4">Design</label>
                </fieldset>
            </div>

            <!-- Written Review -->
            <div class="form-group">
                <label for="reviewText">Written Review (Optional)</label>
                <textarea id="reviewText" name="reviewText" rows="4"></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="username">Your Name (Optional)</label>
                <input type="text" id="username" name="username">
            </div>

            <!-- Submit -->
            <div class="form-group">
                <input type="submit" value="Submit Review">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Product Reviews</p>
    </footer>
</body>

</html>
